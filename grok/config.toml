# Grok Build user config for this Mac.
# Versioned in ~/github/agents/grok/config.toml and linked to ~/.grok/config.toml by ic-link.
# Claude and Cursor named-instruction, MCP, and hook compatibility is off so Grok
# uses its own AGENTS.md, skills, and agents rather than inheriting Claude's.

[cli]
installer = "curl"

[models]
default = "grok-4.6"
default_reasoning_effort = "high"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.6"
yolo = false
compact_mode = false
permission_mode = "always-approve"

[compat.claude]
skills = false
rules = false
agents = false
mcps = false
hooks = false
sessions = true

[compat.cursor]
skills = false
rules = false
agents = false
mcps = false
hooks = false
sessions = true
