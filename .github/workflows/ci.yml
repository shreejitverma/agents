name: CI

# The manuals are generated, and every tool on the machine reads one of them
# through a symlink into this repo. A hand-edited or stale manual therefore
# ships different rules to different tools silently. `--check` is what catches
# that, so it runs here on every change rather than relying on someone
# remembering to run it before committing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manuals:
    name: Manuals match their sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Lint the generator
        run: shellcheck -x bin/build-manuals

      # Fails when a generated manual is stale or was edited by hand, and when a
      # tuning file or agent prompt repeats a CORE.md or ROUTING.md line byte for
      # byte. What that comparison covers is documented in bin/build-manuals.
      - name: Verify every manual matches its sources
        run: bin/build-manuals --check

  hooks:
    name: Hook tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # claude/settings.json runs claude/hooks/guard.py before every Bash and
      # edit call and post_edit.py after every edit, so a regression either
      # blocks work, lets a destructive command through, or feeds the model
      # wrong lint findings. The suites drive the real scripts, including as a
      # subprocess the way Claude Code invokes them.
      - name: Run the hook tests
        run: python3 -m unittest discover -s claude/hooks -v

      - name: Lint and format-check the hooks
        run: |
          pipx run ruff==0.16.1 check claude/hooks
          pipx run ruff==0.16.1 format --check claude/hooks

